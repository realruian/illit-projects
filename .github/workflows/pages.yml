name: Deploy GitHub Pages

on:
  push:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read
  pages: write
  id-token: write

concurrency:
  group: pages
  cancel-in-progress: true

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
          cache-dependency-path: study-guide/package-lock.json

      - name: Build and test study guide
        working-directory: study-guide
        run: |
          npm ci
          npm run build
          npm test

      - name: Build album catalog
        run: python3 album-catalog/src/assemble.py

      - name: Assemble site
        run: |
          mkdir -p _site/album-catalog _site/study-guide
          cp site/index.html _site/index.html
          cp "album-catalog/dist/ILLIT-实体唱片收藏图鉴.html" _site/album-catalog/index.html
          cp -R album-catalog/dist/images _site/album-catalog/images
          cp study-guide/dist/index.html _site/study-guide/index.html

      - uses: actions/configure-pages@v5

      - uses: actions/upload-pages-artifact@v3
        with:
          path: _site

  deploy:
    needs: build
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - id: deployment
        uses: actions/deploy-pages@v4
