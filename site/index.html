<!doctype html>
<html lang="zh-CN">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>ILLIT 个人项目</title>
<meta name="description" content="ILLIT 个人粉丝项目：实体专辑版本图鉴与互动学习指南。">
<style>
:root{--bg:#f7f5fb;--paper:#fff;--ink:#1f1a2e;--muted:#625a74;--line:#e4def0;--accent:#5b2fb8}
@media (prefers-color-scheme: dark){:root:not([data-theme="light"]){--bg:#15121c;--paper:#1f1b29;--ink:#efeaf8;--muted:#b3aac4;--line:#363047;--accent:#c7b0ff}}
:root[data-theme="dark"]{--bg:#15121c;--paper:#1f1b29;--ink:#efeaf8;--muted:#b3aac4;--line:#363047;--accent:#c7b0ff}
*{box-sizing:border-box}
body{margin:0;background:var(--bg);color:var(--ink);font:16px/1.6 system-ui,-apple-system,"PingFang SC","Hiragino Sans GB","Microsoft YaHei",sans-serif}
main{max-width:760px;margin:0 auto;padding:56px 16px 40px}
h1{font-size:clamp(28px,6vw,40px);line-height:1.15;margin:0 0 8px;letter-spacing:-.01em}
.lead{color:var(--muted);margin:0 0 28px}
.list{display:grid;gap:14px}
a.item{display:block;background:var(--paper);border:1px solid var(--line);border-radius:14px;padding:18px 20px;color:inherit;text-decoration:none}
a.item:hover{border-color:var(--accent)}
a.item:focus-visible{outline:3px solid var(--accent);outline-offset:2px}
.item h2{margin:0 0 4px;font-size:19px;color:var(--accent)}
.item p{margin:0;color:var(--muted);font-size:14.5px}
footer{margin-top:36px;font-size:12.5px;color:var(--muted)}
footer a{color:var(--accent)}
</style>
</head>
<body>
<main>
  <h1>ILLIT 个人项目</h1>
  <p class="lead">个人粉丝用途的非商业项目。</p>
  <div class="list">
    <a class="item" href="album-catalog/">
      <h2>实体专辑与版本图鉴</h2>
      <p>按发行时间整理韩语迷你专辑、单曲专辑和日本实体单曲的全部基础版本与内含物，可按成员和版本类型筛选。</p>
    </a>
    <a class="item" href="study-guide/">
      <h2>互动追星学习指南</h2>
      <p>五关中文讲解、成员档案、小工具、测验和笔记，学习记录只保存在你自己的浏览器里。</p>
    </a>
  </div>
  <footer>图片版权归 BELIFT LAB、HYBE、Weverse、环球音乐等原权利人所有。源码见 <a href="https://github.com/realruian/illit-projects">GitHub</a>。</footer>
</main>
</body>
</html>
